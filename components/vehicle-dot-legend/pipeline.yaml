    direction: VehicleDot always writes its aria-label from the locale, even when aria-hidden. If a caller passes a *Label to the legend, each hidden dot keeps the locale's word while the visible word changes. Nothing hears the dot, but to keep the two in step the legend could pass the overrides to its dots, or VehicleDot could leave out aria-label when it is aria-hidden.
