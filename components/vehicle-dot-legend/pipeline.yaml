    direction: 'The legend''s <ul> has list-style: none, and Safari with VoiceOver drops the list role from such a list unless it has role="list". StopTimeline, KioskBar, DisruptionCard and DayProfileChart do the same, and the spec allows no ARIA here. Options: accept it library-wide, or add role="list" to every unstyled list as a contract rule.'
