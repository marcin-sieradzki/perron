    direction: No component gives disabled text a forced-colours treatment (GrayText). In Windows contrast themes, a disabled legend or label looks live next to native controls that the browser greys out. This could be a library-wide rule in the contract.
  - stage: brief
    at: 2026-10-25T04:44:49.699Z
