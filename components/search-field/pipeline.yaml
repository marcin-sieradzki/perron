      1. (Anatomy) Clear button composes the CloseButton shared part through Autocomplete.Clear's render, with the owned 'Clear' label, not rendered while disabled; the build adds Autocomplete.Clear to the part's "Composed in" cell. Recommended: yes.
      2. (Props) SearchField is a composite control: root is Field.Root's div, value is the typed words, onChange(event, value, details) adapted from onValueChange. Recommended: yes.
      3. (Props) From Autocomplete.Root it offers only items, filter, value, defaultValue, onChange, open, defaultOpen, onOpen, onClose, keeping Base UI's defaults for the rest. Recommended: yes.
      4. (Props) SearchFieldProps extends Field.Root.Props without children, ref, invalid, validate, validationMode, validationDebounceTime, actionsRef, dirty, touched; no invalid state. Recommended: yes.
      5. (Props) A suggestion is SearchFieldItem { value; label; description?; startIcon? }, items SearchFieldItem[], filter ((item, query) => boolean) | null, no disabled per item. Recommended: yes.
      6. (Props) A chosen suggestion is reported by onItemSelect(event, item) from the item's onClick. Recommended: yes.
      7. (Props) A required label ReactNode plus hiddenLabel boolean (default false) through VisuallyHidden. Recommended: yes.
      8. (Props) No variant, size, color or fullWidth; root takes its container's width, box size.input tall. Recommended: yes.
      9. (Props) The default filter keeps Base UI's collator in the runtime's locale. Recommended: yes.
