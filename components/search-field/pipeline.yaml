      14. (Component rules) The input gets enterKeyHint="search", keeping type="text". Recommended: yes.
      15. (Component rules) The list opens and closes at once, with no transition. Recommended: yes.
      16. (Stories) No variant property; State property default, hover, focus, open, disabled; stories Default, Hover, Focus, Open, Disabled plus content and behaviour stories. Recommended: yes.
