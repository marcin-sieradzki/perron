  - stage: build
    at: 2026-10-25T07:44:18.733Z
    direction: The contract's Customising section says 'the component's own props last', but Base UI's mergeProps runs the rightmost handler first. A component's own handler merged last therefore runs before the caller's and can't be stopped by it. The contract could say which order handlers run, and that a caller-first handler (Base UI's convention, with preventBaseUIHandler) is merged first.
  - stage: build
    at: 2026-10-25T07:44:18.733Z
