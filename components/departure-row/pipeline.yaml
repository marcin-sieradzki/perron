      5. (Props) Does DepartureRow take `slotProps` keyed by its eight inner parts (badge, destination, status, dot, countdown, schedule, time, delay), with `size` left out of the badge's? Recommended: yes.
      6. (Tokens) Is the row spaced with space.300 between columns, space.050 between lines, space.200 above and below, space.100 between the dot and its word and between the time and the delay, with no divider, fill or radius? Recommended: yes.
