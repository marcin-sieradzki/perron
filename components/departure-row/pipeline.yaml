      1. (Anatomy) Is the row a grid of three columns and two lines: the LineBadge at the start, centred on both lines; the destination over the status (the VehicleDot and its state's word) in the middle; the countdown over the schedule (timetabled time and Delay) at the end; no platform, tag, action or "Show on map"? Recommended: yes.
