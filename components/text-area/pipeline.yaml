  - stage: brief
    at: 2026-10-25T06:25:56.009Z
    direction: No token gives a multi-line box's block padding, so the spec derives it from size.input, 1lh and border.width.025. If more multi-line controls come, a field padding token may be worth adding through the design-tokens skill.
  - stage: brief
    at: 2026-10-25T06:25:56.009Z
    direction: The resize grip and the textarea's scrollbar are the browser's own, unthemed in dark mode and below size.target-min. The spec relies on WCAG 2.5.8's user-agent exception. A drawn design should decide whether Mylder wants the native grip at all.
  - stage: brief
    at: 2026-10-25T06:25:56.009Z
    questions: "1. Should TextAreaProps extend the textarea's own attributes (Omit<ComponentPropsWithoutRef<'textarea'>, 'onChange'|'value'|'defaultValue'|'disabled'|'children'|'dangerouslySetInnerHTML'|'className'|'style'>) with className and style from Pick<Field.Control.Props>, instead of Field.Control.Props as TextField does? Recommended: yes. 2. Should TextArea leave out Base UI's render, so the root is always the textarea? Recommended: yes. 3. Should rows be TextArea's own prop, a number defaulting to 3? Recommended: yes. 4. Should the box keep the height its rows give it, resized taller by the browser's grip, with no auto-grow (no field-sizing, minRows or maxRows)? Recommended: yes. 5. Should TextArea leave out a character count against maxLength? Recommended: yes. 6. Should the block padding be calc((size.input - 1lh - 2 * border.width.025) / 2)? Recommended: yes."
