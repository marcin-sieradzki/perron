    questions: |-
      1. (Props) Does Link take no color, underline, variant or size prop, and no disabled, so it always wears the colour and type of the text it sits in, underlined? Recommended: yes.
      2. (Tokens) Does Link keep the colour of the text around it in every state, :visited included, underlined in that colour in every state, as Attribution's links are? Recommended: yes.
