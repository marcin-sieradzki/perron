      4. (Keyboard and ARIA, target checklist line) Does Link add no padding or minimum height of its own, meeting WCAG 2.5.8 by the inline and spacing exceptions? Recommended: yes.
      5. (Owned strings) Does Link, like LinkButton, own no 'Opens in a new tab' string, draw no external-link icon and take no external prop, leaving target and rel to the caller? Recommended: yes.
      6. (Component rules, CR-9) Does Attribution keep its own .pn-Attribution :any-link rule in this change, with a separate follow-up deciding whether its links move to Link? Recommended: yes, as a follow-up.
