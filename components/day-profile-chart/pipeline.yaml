    at: 2026-10-25T01:58:32.189Z
    questions: |-
      1. (Intro) Does DayProfileChart plot one series of counts across one calendar day, 00:00 to 24:00, as a line with the area under it, with no marker for the time now, no second series and no day to compare with? Recommended: yes. The only series token is the vehicles in service curve, and a now marker, a second series or a fixed scale can each join later as an optional prop without a break.
      2. (Anatomy) Does the axis show five ticks (00:00, 06:00, 12:00, 18:00, 24:00), and the scale show only its top count, rounded up from the largest known count to the next multiple of half its leading power of ten (412 to 450, 1 260 to 1 500), with 0 left to the baseline? Recommended: yes. The labels fit a 320 px plot, and each point already says its own count to the ear.
      3. (Anatomy) Does the chart show a value tip for one highlighted point, from the pointer, from touch, or from the arrow keys once the plot has focus, with the plot one focus stop whose group points at the highlighted point through aria-activedescendant? Recommended: yes. Elevation names the chart's value tip, Accessibility asks that hover content be reachable without hover, and one stop avoids 24 to 96 Tab stops.
      4. (Props) Does a point take its time as an HH:MM string and its figure as a number named `count`, which the pattern writes in digits grouped in threes by a no-break space ('1 260'), the same in every locale? Recommended: yes. HH:MM matches StopTimeline and KioskBar, `value` is kept for controls, and PerronProvider gives no number format.
      5. (Props) Does the chart take `label` as a required ReactNode, shown above the plot as the figure's figcaption, which also names the plot's group? Recommended: yes. A line with no words says nothing of what it counts, and Stat uses the same name.
      6. (Tokens) Needs a token for the plot's height. Recommended: none; use `aspect-ratio: 3`, which gives 107 px at 320 px wide and 115 px in the overview sheet. No size.* token gives a chart height, and a ratio keeps the curve's shape at every width.
      7. (Tokens) Needs a token for the width of a chart's line. Recommended: border.width.050 (2 px), with 'the line of a chart' added to its use through the design-tokens skill, so the series stands out from the 1 px gridline and baseline.
      8. (Tokens) Needs a typography role for the value tip. Recommended: typography.data with its tracking twin, in place of the Tooltips row's typography.label-sm, since the tip holds only a time and a figure and the data roles keep figures tabular.
