    direction: "The positioner defaults are side 'bottom' and align 'center'. With a narrow trigger near the screen's edge, the centred popup is shifted to collisionPadding, so its start edge sits about 4 px off the trigger's start edge (components-popover--default, root). Options: keep 'center', or default align to 'start' so the popover lines up with its trigger."
