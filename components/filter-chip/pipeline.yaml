    questions: |-
      1. (Anatomy) Does FilterChip take `count?: number` and render it as a neutral Count, adding `Count` to its `dependsOn` in packages/perron/components.json? Recommended: yes. It is typed like Tab's `count`, and Count's own spec names the '3' after 'Delays' in a filter chip as its use.
      2. (Props) Is the state `selected`, `defaultSelected` and `onChange(event, selected, details)`, mapped onto Toggle's `pressed`, `defaultPressed` and `onPressedChange`, with none of Toggle's names exposed? Recommended: yes. `selected` is MUI ToggleButton's prop and the contract's selected design state, and `pressed` is the contract's word for `:active`.
      3. (Props) Does FilterChip leave out Toggle's `value`, which only identifies a toggle inside a ToggleGroup? Recommended: yes. Perron has no group of filter chips, and a group can add `value` later.
      4. (Props) Does it take `startIcon` alone, with no `endIcon`? Recommended: yes. The count is what follows the label.
      5. (Props) Does it come in one look, with no `variant`, `color` or `size`? Recommended: yes. Filter chips have one height, `size.control`, and the brand keeps the interface ink.
      6. (Tokens) Is the selected state read from Toggle's `[data-pressed]`, the press from `:active` alone, with no `data-selected` of FilterChip's own? Recommended: yes. Base UI sets `data-pressed` in both controlled and uncontrolled use.
      7. (Tokens) Does the chip take Button's neutral treatments on a `radius.full` pill: off is outline (transparent, `color.border.control` edge, `color.surface.hover` on hover); on is solid (`color.surface.inverse` with `color.text.inverse`, `color.surface.inverse-hover` on hover); disabled matches Button's disabled outline or solid? Recommended: yes. Elevation gives `color.surface.inverse` to pressed toggles.
      8. (Tokens) Is the chip's icon `icon.size.325`? Recommended: yes. It is the size for icons inline with label text, and the disruption icons are drawn on that grid.
      9. (Tokens) Does a selected chip show its state by its fill alone, with no tick? Recommended: yes. `aria-pressed` tells the ear, forced colours get `Highlight`, and a tick appearing would widen the chip.
      10. (Stories) Do the selected chip's hover and its disabled look get a `SelectedDisabled` story and a hover check in `Selected`'s play test, with no Penpot variant of their own, and the drawing keeping one `State` property (default, hover, focus, selected, disabled)? Recommended: yes.
