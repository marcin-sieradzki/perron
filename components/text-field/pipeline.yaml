    questions: "1. Is the root the <input> itself (Field.Control), with Field round it as the frame? Recommended: yes. 2. Is the frame's slotProps key 'field' (Omit<Field.Root.Props,'children'|'disabled'|'name'>, class pn-TextField-field), the way to reach invalid/validate/validationMode/validationDebounceTime/dirty/touched/actionsRef? Recommended: yes. 3. No startIcon/endIcon, prefix/suffix, clear or password reveal: the input is the whole box? Recommended: yes. 4. TextFieldProps declares name, type, placeholder, required, value, defaultValue (string), onChange (native ChangeEvent) with rows; readOnly, autoComplete etc. stay inherited? Recommended: yes. 5. type is 'text'|'email'|'password'|'tel'|'url', default 'text'? Recommended: yes. 6. optional and required independent, required defaults false? Recommended: yes. 7. No variant, size, color or fullWidth? Recommended: yes. 8. Box takes space.300 on both inline sides, no block padding? Recommended: yes. 9. Box keeps rest look when focused without focus-visible, filled, dirty, touched, valid or read-only; invalid edge only while not disabled? Recommended: yes."
