name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # npm run check builds the website with Next.js, which otherwise reports usage data
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # The whole history, with the release tags that the api-compatibility check compares against
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the Chromium the story tests run in (npm run test:stories, part of npm run check)
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # The docs site in dist/site: the website's static export (built by the check) at the root,
      # Storybook under storybook/, and llms.txt, AGENTS.md and a Markdown twin of every page
      - run: npm run storybook:build
      - run: npm run site:build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  # The docs site, deployed from main once the check passes. The repository's Pages source must be
  # set to GitHub Actions.
  deploy-docs:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
